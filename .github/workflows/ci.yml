name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test ./... -cover

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both engines with a full toolchain, then each production image testing itself
      - run: docker build -f docker/Dockerfile.slim --target test .
      - run: docker build -f docker/Dockerfile --target test --build-arg ENGINE=chrome .
      - run: docker build -f docker/Dockerfile --target test --build-arg ENGINE=lightpanda .
      - run: docker build -f docker/Dockerfile --build-arg ENGINE=chrome -t kagemusha:chrome .
      - run: docker build -f docker/Dockerfile --build-arg ENGINE=lightpanda -t kagemusha:lightpanda .
      - run: docker build -f docker/Dockerfile.slim --build-arg ENGINE=chrome -t kagemusha:chrome-slim .
      - run: docker build -f docker/Dockerfile.slim --build-arg ENGINE=lightpanda -t kagemusha:lightpanda-slim .

  # Native arm64: each production image tests itself (libraries live in other paths than on amd64).
  # GitHub only. Some other CI services hand the job to a runner first and evaluate its `if` there, so outside GitHub it
  # asks for a common label: an arm64 label no runner has would keep the run waiting forever.
  integration-arm64:
    if: github.server_url == 'https://github.com'
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile.slim --target test .
      - run: docker build -f docker/Dockerfile --target test --build-arg ENGINE=chrome .
      - run: docker build -f docker/Dockerfile --target test --build-arg ENGINE=lightpanda .
