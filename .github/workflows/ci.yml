name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test ./... -cover

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile --target test .
      - run: docker build -f docker/Dockerfile --target runtime --build-arg ENGINE=chrome -t kagemusha:chrome .
      - run: docker build -f docker/Dockerfile --target test-lightpanda .
      - run: docker build -f docker/Dockerfile --target runtime --build-arg ENGINE=lightpanda -t kagemusha:lightpanda .
